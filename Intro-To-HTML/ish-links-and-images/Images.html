    <h1>Images</h1>
        <p>This page covers common image formats, but you may <br> also be looking for 
        <a href="Links.html">links</a> and <a href="misc/extras.html">useful extras</a>. 
        </p>

    <h2>JPGs</h2>

        <p>JPG images are good for photos.</p>

        <img src="img/mochi.jpg" width="75" alt="A mochi ball in a bubble">

    <h2>GIFs</h2>

        <p>GIFs are good for animations.</p>

        <img src="img/mochi.gif" width="75" alt="A dancing mochi ball">

    <h2>PNGs</h2>
        
        <p>PNGs are good for diagrams and icons.</p>

        <img src="img/mochi.png" width="75" alt="A mochi ball">

    <h2>SVGs</h2>
<!--These images can resize without loss of quality. Vector-based.-->
<!--However, if there is text in the images, the text needs to be converted to outlines
via image editor and thus may have a big impact on the file size of the image.-->
        <p>SVGs are <em>amazing</em>. Use them wherever you can.</p>

        <img src="img/mochi.svg" alt="A mochi ball with bézier handles">

</body>
</html>
